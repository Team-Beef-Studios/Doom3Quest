plugins {
    id 'com.android.application'
}

// Release signing. Credentials live in a gitignored keystore.properties at the
// repo root (never commit it). If the file is absent the release build stays
// unsigned so the project still builds without the private key.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace 'com.drbeef.doom3quest'
    compileSdk 32

    // Pinned, not left to the AGP default. NDK 27's clang rejects the implicit function
    // declarations in the vendored SDL2 2.0.10 sources (SDL_egl.c).
    ndkVersion '23.1.7779620'

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    defaultConfig {
        applicationId "com.drbeef.doom3quest"
        minSdk 26
        targetSdk 26

        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    externalNativeBuild {
        ndkBuild {
            path 'src/main/jni/Android.mk'
        }
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jni/OpenXR/android']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig keystorePropertiesFile.exists() ? signingConfigs.release : null
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    lintOptions {
        checkReleaseBuilds false
        //If you want to continue even if errors found use following line
        abortOnError false
    }
}

android {
    task PackVrSupportPK4 {
        dependsOn 'Pack399PK4'
        dependsOn 'Pack399RoEPK4'
        dependsOn 'Pack399LMPK4'
        dependsOn 'Pack399CDPK4'
        dependsOn 'Pack399D2PK4'
        dependsOn 'Pack399TFPPK4'
    }
    task Pack399PK4(type: Zip) {
        from 'src/main/pk4/pak399/'
        archiveFileName.set('pak399.pk4')
        getDestinationDirectory().set(file('src/main/assets/'))
    }
    task Pack399RoEPK4(type: Zip) {
        from 'src/main/pk4/pak399roe/'
        archiveFileName.set('pak399roe.pk4')
        getDestinationDirectory().set(file('src/main/assets/'))
    }
    task Pack399LMPK4(type: Zip) {
        from 'src/main/pk4/pak399lm/'
        archiveFileName.set('pak399lm.pk4')
        getDestinationDirectory().set(file('src/main/assets/'))
    }
    task Pack399CDPK4(type: Zip) {
        from 'src/main/pk4/pak399cd/'
        archiveFileName.set('pak399cd.pk4')
        getDestinationDirectory().set(file('src/main/assets/'))
    }
    task Pack399D2PK4(type: Zip) {
        from 'src/main/pk4/pak399d2/'
        archiveFileName.set('pak399d2.pk4')
        getDestinationDirectory().set(file('src/main/assets/'))
    }
    task Pack399TFPPK4(type: Zip) {
        from 'src/main/pk4/pak399tfp/'
        archiveFileName.set('pak399tfp.pk4')
        getDestinationDirectory().set(file('src/main/assets/'))
    }
    afterEvaluate {
        if (project(':app').tasks.findByName('createDebugVariantModel'))
            project(':app').createDebugVariantModel.dependsOn PackVrSupportPK4
        if (project(':app').tasks.findByName('createReleaseVariantModel'))
            project(':app').createReleaseVariantModel.dependsOn PackVrSupportPK4
    }
    preBuild.dependsOn PackVrSupportPK4
}
dependencies {
    implementation "com.android.support:support-compat:26.1.0"
    implementation "com.android.support:support-core-utils:26.1.0"
    implementation files('src/main/libs/haptic_service.aar')
}